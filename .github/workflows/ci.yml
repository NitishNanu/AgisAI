name: AegisAI Backend CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Type Check & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: aegisai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ruff Linter Check
        run: |
          ruff check backend/

      - name: Mypy Type Check
        run: |
          mypy backend/app/ --ignore-missing-imports

      - name: Run Test Suite with Pytest
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql://postgres:password@localhost:5432/aegisai_test
          SECRET_KEY: test_secret_key_minimum_32_characters_long_for_ci_pipeline
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=xml
